; Template project for a new CamPortal device.
; Copy this folder, rename it, and adjust the board and the pins in include/config.h.

[env:newdevice]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
build_flags =
	-DCORE_DEBUG_LEVEL=0
	-iquote include
lib_extra_dirs = ../FirmwareLibs
lib_deps =
	bblanchon/ArduinoJson@^7.4.2
	adafruit/Adafruit NeoPixel@^1.12.4
board_build.embed_files =
	data/jsqr.min.js.gz
	data/nacl.min.js.gz
