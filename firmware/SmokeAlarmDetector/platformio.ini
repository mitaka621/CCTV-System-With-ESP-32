; Smoke alarm detector. Battery powered, deep sleeping.
; Board is an ESP32-S3 Super Mini, which has no universal serial bus to serial
; bridge, so serial output has to go over the chip's native universal serial bus.

[env:smokealarmdetector]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder

; Hardware serial treats data terminal ready as "a terminal is attached" and
; discards output when it is low. Request to send stays low because the serial
; and joint test action group peripheral reads both together as a request to
; enter the read only memory downloader.
monitor_dtr = 1
monitor_rts = 0

board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv

build_flags =
	-DCORE_DEBUG_LEVEL=0
	-iquote include
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1

lib_extra_dirs = ../FirmwareLibs
lib_deps =
	bblanchon/ArduinoJson@^7.4.2
board_build.embed_files =
	data/jsqr.min.js.gz
	data/nacl.min.js.gz
