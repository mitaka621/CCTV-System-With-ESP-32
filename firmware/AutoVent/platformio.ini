; Automatic vent fan. Mains powered, always awake.
; The original ESP32 has no HMAC peripheral, so SecretStore keeps its values in
; plain text on this board. See ../FirmwareLibs/README.md.

[env:autovent]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder

board_build.partitions = huge_app.csv

build_flags =
	-DCORE_DEBUG_LEVEL=0
	-iquote include

lib_extra_dirs = ../FirmwareLibs
lib_deps =
	bblanchon/ArduinoJson@^7.4.2
	adafruit/Adafruit NeoPixel@^1.12.4
	waspinator/AccelStepper@^1.64
	paulstoffregen/OneWire@^2.3.8
	milesburton/DallasTemperature@^4.0.6
board_build.embed_files =
	data/jsqr.min.js.gz
	data/nacl.min.js.gz
