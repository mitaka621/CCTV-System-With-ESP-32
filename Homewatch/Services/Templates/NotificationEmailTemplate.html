<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="supported-color-schemes" content="dark">
    <title>{{Title}}</title>
</head>
<body style="margin:0;padding:0;background-color:#0d1117;-webkit-text-size-adjust:100%;">
    <div style="display:none;max-height:0;max-width:0;overflow:hidden;opacity:0;mso-hide:all;">{{Preheader}}</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0d1117" style="background-color:#0d1117;">
        <tr>
            <td align="center" style="padding:32px 16px;">
                <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;">
                    <tr>
                        <td style="padding:0 4px 16px 4px;font-family:Roboto,'Segoe UI',Helvetica,Arial,sans-serif;font-size:20px;font-weight:500;line-height:28px;color:#ffffff;">
                            Homewatch
                        </td>
                    </tr>
                    <tr>
                        <td bgcolor="{{SurfaceColor}}" style="background-color:{{SurfaceColor}};border:1px solid #2c2c40;border-radius:12px;overflow:hidden;">
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td bgcolor="{{BannerBackground}}" style="background-color:{{BannerBackground}};border-left:4px solid {{BannerColor}};border-radius:12px 12px 0 0;padding:14px 24px;font-family:Roboto,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;line-height:18px;letter-spacing:1.5px;text-transform:uppercase;color:{{BannerColor}};">
                                        {{BannerLabel}}
                                    </td>
                                </tr>
                                <tr>
                                    <td style="padding:32px 32px 8px 32px;">
                                        <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                                            <tr>
                                                <td width="64" height="64" align="center" valign="middle" bgcolor="{{IconBackground}}" style="width:64px;height:64px;background-color:{{IconBackground}};border-radius:50%;">
                                                    <img src="{{IconSource}}" width="36" height="36" alt="" style="display:block;width:36px;height:36px;border:0;outline:none;">
                                                </td>
                                                <td valign="middle" style="padding-left:20px;font-family:Roboto,'Segoe UI',Helvetica,Arial,sans-serif;font-size:22px;font-weight:500;line-height:30px;color:#ffffff;">
                                                    {{Title}}
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                                <tr>
                                    <td style="padding:16px 32px 0 32px;font-family:Roboto,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;line-height:24px;color:#c4c4d0;">
                                        {{Description}}
                                    </td>
                                </tr>
                                <tr>
                                    <td style="padding:16px 32px 0 32px;font-family:Roboto,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;line-height:18px;color:#8b8b9e;">
                                        {{DateCreated}}
                                    </td>
                                </tr>
                                <!--REDIRECT_START-->
                                <tr>
                                    <td style="padding:28px 32px 0 32px;">
                                        <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                                            <tr>
                                                <td align="center" bgcolor="#776be7" style="background-color:#776be7;border-radius:4px;">
                                                    <a href="{{RedirectUrl}}" target="_blank" style="display:inline-block;padding:12px 28px;font-family:Roboto,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;font-weight:500;line-height:20px;letter-spacing:0.4px;text-transform:uppercase;color:#ffffff;text-decoration:none;border-radius:4px;">Open in Portal</a>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                                <tr>
                                    <td style="padding:16px 32px 0 32px;font-family:Roboto,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;line-height:18px;color:#8b8b9e;word-break:break-all;">
                                        If the button does not work, open this link: <a href="{{RedirectUrl}}" target="_blank" style="color:#9d94f0;text-decoration:underline;">{{RedirectUrl}}</a>
                                    </td>
                                </tr>
                                <!--REDIRECT_END-->
                                <tr>
                                    <td style="padding:32px 32px 0 32px;">
                                        <div style="height:1px;line-height:1px;font-size:1px;background-color:#2c2c40;">&nbsp;</div>
                                    </td>
                                </tr>
                                <tr>
                                    <td style="padding:16px 32px 24px 32px;font-family:Roboto,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;line-height:18px;color:#8b8b9e;">
                                        You are receiving this email because email notifications are enabled in Homewatch.
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
